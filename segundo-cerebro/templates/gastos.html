<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gastos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #080808; 
            --superficie: #141414;
            --borde-suave: rgba(212, 175, 55, 0.2); 
            --borde-fuerte: rgba(212, 175, 55, 0.6); 
            --texto-principal: #ffffff;
            --texto-secundario: #a0a0a0;
            --rojo-gasto: #E57373; 
            --oro: #D4AF37; 
        }

        body { font-family: 'Nunito Sans', sans-serif; background-color: var(--bg-color); color: var(--texto-principal); padding: 40px 50px; margin: 0; line-height: 1.6; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--texto-principal); }

        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .main-title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 4rem; color: var(--rojo-gasto); margin: 0; text-shadow: 2px 2px 15px rgba(229, 115, 115, 0.15); }

        .nav-menu { display: flex; gap: 15px; }
        .nav-btn { background: transparent; color: var(--texto-principal); border: 1px solid var(--texto-secundario); padding: 12px 25px; border-radius: 30px; text-transform: uppercase; font-size: 13px; text-decoration: none; transition: 0.3s; }
        .btn-volver:hover { border-color: #fff; background: rgba(255,255,255,0.05); }
        .btn-ingresos:hover { color: #81C784; border-color: #81C784; background-color: rgba(129, 199, 132, 0.05); }
        .btn-ahorros:hover { color: #00BCD4; border-color: #00BCD4; background-color: rgba(0, 188, 212, 0.05); }
        .btn-inversiones:hover { color: var(--oro); border-color: var(--oro); background-color: rgba(212, 175, 55, 0.05); }
        
        .controles, .kpi-card, .chart-box { background: var(--superficie); border: 1px solid var(--borde-suave); border-top: 2px solid var(--borde-fuerte); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .controles { display: flex; gap: 15px; align-items: center; margin-bottom: 30px; padding: 20px; }
        
        button.action-btn { background: transparent; color: white; border: 1px solid white; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-family: 'Nunito Sans', sans-serif; font-weight: 600; transition: 0.3s; }
        button.action-btn:hover { background: rgba(255,255,255,0.1); }
        
        select { 
            background: transparent; color: white; border: 1px solid #555; padding: 10px 35px 10px 15px; border-radius: 30px; appearance: none; cursor: pointer; 
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 10px auto;
        }
        select option { background-color: var(--superficie); color: white; }

        .kpi-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .kpi-card { padding: 25px; flex: 1; text-align: center; }
        .kpi-card h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Nunito Sans', sans-serif; color: var(--texto-secundario); }
        .kpi-card p { font-size: 2.2rem; color: var(--rojo-gasto); margin: 10px 0 0; }
        
        .text-green { color: #81C784; }
        .text-red { color: #E57373; }
        .text-orange { color: #FFB74D; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.95rem; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--texto-secundario); font-family: 'Playfair Display', serif; font-weight: 600; font-size: 0.9rem; letter-spacing: 1px; }
        tr:hover { background-color: rgba(255, 255, 255, 0.05); }

        .chart-row { display: flex; gap: 25px; margin-bottom: 20px; }
        .flex-1 { flex: 1; width: 50%; }
        .chart-box { padding: 25px; margin-top: 20px; }
        .tabs { display: flex; gap: 20px; margin-bottom: 30px; }
        .tab-btn { background: none; border: none; font-size: 1.1rem; color: var(--texto-secundario); cursor: pointer; font-family: 'Playfair Display', serif; }
        .tab-btn.activo { color: var(--rojo-gasto); border-bottom: 2px solid var(--rojo-gasto); }
        .vista { display: none; }
        .vista.activa { display: block; }
    </style>
</head>
<body>

    <header class="top-header">
        <h1 class="main-title">Gastos</h1>
        <div class="nav-menu">
            <a href="/" class="nav-btn btn-volver">Volver</a>
            <a href="/ingresos" class="nav-btn btn-ingresos">Ingresos</a>
            <a href="/ahorros" class="nav-btn btn-ahorros">Ahorros</a>
            <a href="/inversiones" class="nav-btn btn-inversiones">Inversiones</a>
        </div>
    </header>

    <div class="controles">
        <select id="yearSelector" onchange="actualizarInterfaz()"></select>
        <select id="mesSelector" onchange="actualizarInterfaz()"></select>
        <script>
            const mesSel = document.getElementById('mesSelector');
            const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const mesesEng = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            meses.forEach((m, i) => {
                const opt = document.createElement('option');
                opt.value = mesesEng[i];
                opt.textContent = m;
                mesSel.appendChild(opt);
            });
        </script>
        <button class="action-btn" onclick="irAEsteMes()">📍 Este Mes</button>
        <button class="action-btn" onclick="cargarDatos()" style="margin-left: auto;">🔄 Sincronizar Datos</button>
    </div>

    <div class="tabs">
        <button class="tab-btn activo" onclick="cambiarPestana('mensual', this)">Vista Mensual</button>
        <button class="tab-btn" onclick="cambiarPestana('anual', this)">Vista Anual</button>
    </div>

    <div id="vista-mensual" class="vista activa">
        <div class="kpi-container">
            <div class="kpi-card"><h3>Gastado (✅)</h3><p id="kpi-pagado-mes">0.00 €</p></div>
            <div class="kpi-card"><h3>Pendiente (🅿️)</h3><p id="kpi-pendiente-mes" class="text-orange">0.00 €</p></div>
        </div>
        <div class="chart-row">
            <div class="flex-1">
                <h3 style="margin-top: 0;">Comparativa vs Media Histórica</h3>
                <table id="tabla-comparativa-container">
                    <thead>
                        <tr>
                            <th>Categoría</th>
                            <th>Gasto</th>
                            <th>Media</th>
                            <th>Evolución</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-comparativa"></tbody>
                </table>
            </div>
            <div class="flex-1 chart-box" style="margin-top: 0; display: flex; justify-content: center; align-items: center;">
                <canvas id="graficoDonutMes"></canvas>
            </div>
        </div>
        <div class="chart-row">
            <div class="flex-1 chart-box"><canvas id="graficoBarrasOrdenado"></canvas></div>
            <div class="flex-1 chart-box"><canvas id="graficoSankey"></canvas></div>
        </div>
    </div>

    <div id="vista-anual" class="vista">
        <div class="kpi-container">
            <div class="kpi-card"><h3>Total Año Gastado</h3><p id="kpi-total-ano">0.00 €</p></div>
        </div>
        <div class="chart-box">
            <canvas id="graficoAnualApilado"></canvas>
        </div>
        <div class="chart-row">
            <div class="flex-1 chart-box"><canvas id="graficoBarrasAnualOrdenado"></canvas></div>
            <div class="flex-1 chart-box"><canvas id="graficoSankeyAnual"></canvas></div>
        </div>
    </div>

    <script>
        Chart.defaults.color = '#a0a0a0';
        Chart.defaults.borderColor = '#222'; 
        Chart.defaults.font.family = "'Nunito Sans', sans-serif";

        const tituloGraficoBlanco = { color: '#f0f0f0', font: { family: "'Playfair Display', serif", size: 16, weight: 600 } };
        let datosGlobales = [];
        let graficoDonutMesInstancia, graficoBarrasOrdenadoInstancia, graficoSankeyInstancia, graficoAnualApiladoInstancia, graficoBarrasAnualOrdenadoInstancia, graficoSankeyAnualInstancia;

        function obtenerColor(cat) {
            const paleta = { 'Vivienda': '#E57373', 'Comida': '#FFB74D', 'Transporte': '#4FC3F7', 'Ocio': '#BA68C8', 'Suscripciones': '#81C784' };
            return paleta[cat] || '#' + (Math.random().toString(16) + '000000').substring(2, 8).toUpperCase();
        }

        function parsearFecha(fechaStr) {
            if (!fechaStr) return { mes: "", ano: "" };
            if (String(fechaStr).includes('-') && String(fechaStr).includes('T')) {
                const d = new Date(fechaStr);
                const mesesEng = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                return { mes: mesesEng[d.getMonth()], ano: d.getFullYear().toString() };
            }
            const partes = String(fechaStr).split(',');
            if (partes.length >= 3) return { mes: partes[1].trim(), ano: partes[2].trim() };
            return { mes: "Desconocido", ano: "Desconocido" };
        }

        async function cargarDatos() {
            try {
                const res = await fetch('/api/gastos');
                const json = await res.json();
                datosGlobales = json.gastos.filter(i => i.fecha && i.cantidad !== undefined); 
                configurarFiltros();
                irAEsteMes();
            } catch (e) { alert("Error cargando gastos"); }
        }

        function configurarFiltros() {
            const selectorAno = document.getElementById('yearSelector');
            const anosUnicos = new Set();
            datosGlobales.forEach(i => {
                const ano = parsearFecha(i.fecha).ano;
                if (ano && ano !== "Desconocido") anosUnicos.add(ano);
            });
            selectorAno.innerHTML = '';
            Array.from(anosUnicos).sort().forEach(ano => {
                selectorAno.innerHTML += `<option value="${ano}">${ano}</option>`;
            });
        }

        function irAEsteMes() {
            const fechaActual = new Date();
            const mesesEng = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const anoActual = fechaActual.getFullYear().toString();
            const mesActual = mesesEng[fechaActual.getMonth()];
            const selectorAno = document.getElementById('yearSelector');
            if (Array.from(selectorAno.options).some(opt => opt.value === anoActual)) selectorAno.value = anoActual;
            document.getElementById('mesSelector').value = mesActual;
            actualizarInterfaz();
        }

        function cambiarPestana(vista, boton) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
            document.getElementById(`vista-${vista}`).classList.add('activa');
            boton.classList.add('activo');
        }

        function actualizarInterfaz() {
            const anoSel = document.getElementById('yearSelector').value;
            const mesSel = document.getElementById('mesSelector').value;
            procesarVistaMensual(mesSel, anoSel);
            procesarVistaAnual(anoSel);
        }

        function procesarVistaMensual(mes, ano) {
            const datosMes = datosGlobales.filter(i => parsearFecha(i.fecha).mes === mes && parsearFecha(i.fecha).ano === ano);
            let pagado = 0, pendiente = 0;
            const porCategoria = {};

            datosMes.forEach(item => {
                if (String(item.estado).includes('✅')) pagado += item.cantidad;
                if (String(item.estado).includes('🅿️')) pendiente += item.cantidad;
                porCategoria[item.categoria] = (porCategoria[item.categoria] || 0) + item.cantidad;
            });

            document.getElementById('kpi-pagado-mes').innerText = pagado.toFixed(2) + ' €';
            document.getElementById('kpi-pendiente-mes').innerText = pendiente.toFixed(2) + ' €';

            const tabla = document.getElementById('tabla-comparativa');
            tabla.innerHTML = '';
            const mesesTotales = new Set(datosGlobales.map(i => parsearFecha(i.fecha).mes + parsearFecha(i.fecha).ano)).size;

            Object.keys(porCategoria).forEach(cat => {
                const totalCatMes = porCategoria[cat];
                const totalHist = datosGlobales.filter(i => i.categoria === cat).reduce((acc, curr) => acc + curr.cantidad, 0);
                const media = totalHist / (mesesTotales || 1);
                let evol = media > 0 ? ((totalCatMes - media) / media) * 100 : 0;
                let colorClase = evol <= 0 ? 'text-green' : 'text-red';
                tabla.innerHTML += `<tr><td><strong>${cat}</strong></td><td>${totalCatMes.toFixed(2)} €</td><td>${media.toFixed(2)} €</td><td class="${colorClase}">${evol >= 0 ? '▲ +' : '▼ '}${evol.toFixed(1)}%</td></tr>`;
            });

            const ctxDonut = document.getElementById('graficoDonutMes').getContext('2d');
            if (graficoDonutMesInstancia) graficoDonutMesInstancia.destroy();
            graficoDonutMesInstancia = new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(porCategoria),
                    datasets: [{ data: Object.values(porCategoria), backgroundColor: Object.keys(porCategoria).map(cat => obtenerColor(cat)), borderColor: '#141414', borderWidth: 2 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: 'Distribución del Mes', ...tituloGraficoBlanco }, legend: { position: 'right' } } }
            });

            const catsOrd = Object.keys(porCategoria).sort((a, b) => porCategoria[b] - porCategoria[a]);
            const ctxBarras = document.getElementById('graficoBarrasOrdenado').getContext('2d');
            if (graficoBarrasOrdenadoInstancia) graficoBarrasOrdenadoInstancia.destroy();
            graficoBarrasOrdenadoInstancia = new Chart(ctxBarras, {
                type: 'bar',
                data: { labels: catsOrd, datasets: [{ label: 'Gastos (€)', data: catsOrd.map(c => porCategoria[c]), backgroundColor: catsOrd.map(c => obtenerColor(c)), borderRadius: 6 }] },
                options: { responsive: true, plugins: { title: { display: true, text: 'Top Categorías de Gasto', ...tituloGraficoBlanco }, legend: { display: false } } }
            });

            const ctxSankey = document.getElementById('graficoSankey').getContext('2d');
            if (graficoSankeyInstancia) graficoSankeyInstancia.destroy();
            graficoSankeyInstancia = new Chart(ctxSankey, {
                type: 'sankey',
                data: {
                    datasets: [{
                        label: 'Flujo de Gastos',
                        data: Object.keys(porCategoria).map(cat => ({ from: 'Total Gastos', to: cat, flow: porCategoria[cat] })),
                        colorFrom: () => '#ffffff', colorTo: (c) => obtenerColor(c.dataset.data[c.dataIndex].to), colorMode: 'gradient', size: 'max'
                    }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: 'Diagrama de Flujo', ...tituloGraficoBlanco } } }
            });
        }

        function procesarVistaAnual(ano) {
            const datosAno = datosGlobales.filter(i => parsearFecha(i.fecha).ano === ano);
            const mesesEng = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const categoriasUnicas = [...new Set(datosGlobales.map(i => i.categoria))];
            const datasetsMap = {};
            categoriasUnicas.forEach(cat => datasetsMap[cat] = new Array(12).fill(0));

            let totalAnual = 0;
            const porCatAnual = {};
            datosAno.forEach(item => {
                totalAnual += item.cantidad;
                const mIdx = mesesEng.indexOf(parsearFecha(item.fecha).mes);
                if (mIdx !== -1) datasetsMap[item.categoria][mIdx] += item.cantidad;
                porCatAnual[item.categoria] = (porCatAnual[item.categoria] || 0) + item.cantidad;
            });

            document.getElementById('kpi-total-ano').innerText = totalAnual.toFixed(2) + ' €';

            const ctxApilado = document.getElementById('graficoAnualApilado').getContext('2d');
            if (graficoAnualApiladoInstancia) graficoAnualApiladoInstancia.destroy();
            graficoAnualApiladoInstancia = new Chart(ctxApilado, {
                type: 'bar',
                data: {
                    labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                    datasets: categoriasUnicas.map(cat => ({ label: cat, data: datasetsMap[cat], backgroundColor: obtenerColor(cat), borderRadius: 4 })).filter(ds => ds.data.some(v => v > 0))
                },
                options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }, plugins: { title: { display: true, text: 'Evolución Mensual', ...tituloGraficoBlanco } } }
            });

            const catsAnualOrd = Object.keys(porCatAnual).sort((a, b) => porCatAnual[b] - porCatAnual[a]);
            const ctxBarrasAnual = document.getElementById('graficoBarrasAnualOrdenado').getContext('2d');
            if (graficoBarrasAnualOrdenadoInstancia) graficoBarrasAnualOrdenadoInstancia.destroy();
            graficoBarrasAnualOrdenadoInstancia = new Chart(ctxBarrasAnual, {
                type: 'bar',
                data: {
                    labels: catsAnualOrd,
                    datasets: [{ label: 'Gasto Total (€)', data: catsAnualOrd.map(c => porCatAnual[c]), backgroundColor: catsAnualOrd.map(c => obtenerColor(c)), borderRadius: 6 }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: 'Top Categorías del Año', ...tituloGraficoBlanco }, legend: { display: false } } }
            });

            const ctxSankeyAnual = document.getElementById('graficoSankeyAnual').getContext('2d');
            if (graficoSankeyAnualInstancia) graficoSankeyAnualInstancia.destroy();
            graficoSankeyAnualInstancia = new Chart(ctxSankeyAnual, {
                type: 'sankey',
                data: {
                    datasets: [{
                        label: 'Flujo Anual',
                        data: Object.keys(porCatAnual).map(cat => ({ from: 'Total Anual', to: cat, flow: porCatAnual[cat] })),
                        colorFrom: () => '#ffffff', colorTo: (c) => obtenerColor(c.dataset.data[c.dataIndex].to), colorMode: 'gradient', size: 'max'
                    }]
                },
                options: { responsive: true, plugins: { title: { display: true, text: 'Diagrama de Flujo Anual', ...tituloGraficoBlanco } } }
            });
        }
        
        window.onload = cargarDatos;
    </script>
</body>
</html>
